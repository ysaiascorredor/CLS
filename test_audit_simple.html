<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSA Audit Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e293b, #334155);
            color: white;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: rgba(255,255,255,0.2);
            color: white;
        }
        button {
            background: #3b82f6;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #2563eb;
        }
        .work-types {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .work-type {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
        }
        .message {
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background: rgba(34, 197, 94, 0.3);
        }
        .error {
            background: rgba(239, 68, 68, 0.3);
        }
        .questions {
            margin-top: 30px;
        }
        .question-card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .question-buttons {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }
        .compliant {
            background: #22c55e;
        }
        .non-compliant {
            background: #ef4444;
        }
        .fields {
            margin-top: 20px;
        }
        textarea {
            width: 100%;
            min-height: 80px;
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: rgba(255,255,255,0.2);
            color: white;
            resize: vertical;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔒 CSA Construction Safety Audit - Test Completo</h1>
        
        <!-- Login Form -->
        <div id="loginForm">
            <h2>Paso 1: Login</h2>
            <div class="form-group">
                <label>Email:</label>
                <input type="email" id="email" value="demo@csaaudit.com">
            </div>
            <div class="form-group">
                <label>Password:</label>
                <input type="password" id="password" value="demo123">
            </div>
            <button onclick="doLogin()">Iniciar Sesión</button>
        </div>

        <!-- Audit Form -->
        <div id="auditForm" style="display: none;">
            <h2>Paso 2: Crear Auditoría</h2>
            <div class="form-group">
                <label>Nombre del Sitio:</label>
                <input type="text" id="siteName" value="Obra de Prueba">
            </div>
            <div class="form-group">
                <label>Nombre del Auditor:</label>
                <input type="text" id="auditorName" value="Auditor Demo">
            </div>
            <div class="form-group">
                <label>Seleccionar tipos de trabajo (mínimo 1):</label>
                <div class="work-types">
                    <div class="work-type">
                        <input type="checkbox" id="excavation" value="excavation" checked>
                        <label for="excavation">Excavation Work</label>
                    </div>
                    <div class="work-type">
                        <input type="checkbox" id="height_work" value="height_work" checked>
                        <label for="height_work">Height Work</label>
                    </div>
                    <div class="work-type">
                        <input type="checkbox" id="welding" value="welding">
                        <label for="welding">Welding Operations</label>
                    </div>
                    <div class="work-type">
                        <input type="checkbox" id="electrical" value="electrical">
                        <label for="electrical">Electrical Work</label>
                    </div>
                    <div class="work-type">
                        <input type="checkbox" id="concrete" value="concrete">
                        <label for="concrete">Concrete Work</label>
                    </div>
                    <div class="work-type">
                        <input type="checkbox" id="scaffolding" value="scaffolding">
                        <label for="scaffolding">Scaffolding</label>
                    </div>
                </div>
            </div>
            <button onclick="createAudit()">Iniciar Auditoría</button>
        </div>

        <!-- Questions -->
        <div id="questionsForm" style="display: none;">
            <h2>Paso 3: Responder Preguntas</h2>
            <div id="currentQuestion" class="question-card">
                <!-- Questions will be loaded here -->
            </div>
        </div>

        <!-- Results -->
        <div id="results" style="display: none;">
            <h2>¡Auditoría Completada!</h2>
            <div id="resultsContent"></div>
        </div>

        <div id="messages"></div>
    </div>

    <script>
        let accessToken = '';
        let currentAudit = null;
        let questions = [];
        let currentQuestionIndex = 0;
        let findings = [];

        const API = 'https://safetypro-audit.preview.emergentagent.com/api';

        function showMessage(text, type = 'success') {
            const messages = document.getElementById('messages');
            messages.innerHTML = `<div class="message ${type}">${text}</div>`;
        }

        async function doLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    accessToken = data.access_token;
                    showMessage(`¡Login exitoso! Bienvenido ${data.user.name}`);
                    document.getElementById('loginForm').style.display = 'none';
                    document.getElementById('auditForm').style.display = 'block';
                } else {
                    const error = await response.json();
                    showMessage(`Error: ${error.detail}`, 'error');
                }
            } catch (error) {
                showMessage(`Error de conexión: ${error.message}`, 'error');
            }
        }

        async function createAudit() {
            const siteName = document.getElementById('siteName').value;
            const auditorName = document.getElementById('auditorName').value;
            
            const checkedBoxes = document.querySelectorAll('input[type="checkbox"]:checked');
            const selectedWorkTypes = Array.from(checkedBoxes).map(cb => cb.value);

            if (selectedWorkTypes.length === 0) {
                showMessage('Debes seleccionar al menos 1 tipo de trabajo', 'error');
                return;
            }

            try {
                const response = await fetch(`${API}/audits`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: JSON.stringify({
                        site_name: siteName,
                        auditor_name: auditorName,
                        selected_work_types: selectedWorkTypes,
                        language: 'es'
                    })
                });

                if (response.ok) {
                    currentAudit = await response.json();
                    
                    // Generate questions based on selected work types
                    const questionsResponse = await fetch(`${API}/audits/questions`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${accessToken}`
                        },
                        body: JSON.stringify({
                            work_types: selectedWorkTypes,
                            language: 'es'
                        })
                    });
                    
                    if (questionsResponse.ok) {
                        const questionsData = await questionsResponse.json();
                        questions = questionsData.questions;
                        
                        showMessage('¡Auditoría creada exitosamente!');
                        document.getElementById('auditForm').style.display = 'none';
                        document.getElementById('questionsForm').style.display = 'block';
                        showCurrentQuestion();
                    } else {
                        showMessage('Error generando preguntas', 'error');
                    }
                } else {
                    const error = await response.json();
                    showMessage(`Error creando auditoría: ${error.detail}`, 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        function showCurrentQuestion() {
            if (currentQuestionIndex >= questions.length) {
                completeAudit();
                return;
            }

            const currentQ = questions[currentQuestionIndex];
            const questionHtml = `
                <div style="background: rgba(59, 130, 246, 0.2); padding: 10px; border-radius: 5px; margin-bottom: 15px;">
                    <strong>Tipo de Trabajo: ${currentQ.work_type.toUpperCase()}</strong>
                </div>
                <h3>Pregunta ${currentQuestionIndex + 1} de ${questions.length}</h3>
                <p><strong>${currentQ.question}</strong></p>
                <div class="question-buttons">
                    <button class="compliant" onclick="answerQuestion(true)">✅ Cumple</button>
                    <button class="non-compliant" onclick="answerQuestion(false)">❌ No Cumple</button>
                </div>
                <div id="nonCompliantFields" style="display: none;">
                    <div class="fields">
                        <div class="form-group">
                            <label>Comentario (Obligatorio para No Cumple):</label>
                            <textarea id="comment" placeholder="Describe el problema encontrado..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Acción Tomada (Obligatorio para No Cumple):</label>
                            <textarea id="actionTaken" placeholder="Describe la acción correctiva tomada..."></textarea>
                        </div>
                        <button onclick="submitNonCompliant()">Continuar con No Cumple</button>
                    </div>
                </div>
            `;
            document.getElementById('currentQuestion').innerHTML = questionHtml;
        }

        async function answerQuestion(isCompliant) {
            if (isCompliant) {
                await submitFinding(true, '', '');
            } else {
                document.getElementById('nonCompliantFields').style.display = 'block';
            }
        }

        async function submitNonCompliant() {
            const comment = document.getElementById('comment').value;
            const actionTaken = document.getElementById('actionTaken').value;

            if (!comment || !actionTaken) {
                showMessage('Comentario y Acción Tomada son obligatorios para No Cumple', 'error');
                return;
            }

            await submitFinding(false, comment, actionTaken);
        }

        async function submitFinding(isCompliant, comment, actionTaken) {
            const currentQ = questions[currentQuestionIndex];
            const finding = {
                question: currentQ.question,
                work_type: currentQ.work_type,
                is_compliant: isCompliant,
                comment: comment,
                action_taken: actionTaken
            };

            try {
                const response = await fetch(`${API}/audits/${currentAudit.id}/findings`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`
                    },
                    body: JSON.stringify(finding)
                });

                if (response.ok) {
                    findings.push(finding);
                    currentQuestionIndex++;
                    showCurrentQuestion();
                } else {
                    const error = await response.json();
                    showMessage(`Error guardando respuesta: ${error.detail}`, 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        }

        async function completeAudit() {
            try {
                const response = await fetch(`${API}/audits/${currentAudit.id}/complete`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    document.getElementById('questionsForm').style.display = 'none';
                    document.getElementById('results').style.display = 'block';
                    
                    const compliantCount = findings.filter(f => f.is_compliant).length;
                    const score = (compliantCount / findings.length) * 100;
                    
                    document.getElementById('resultsContent').innerHTML = `
                        <div class="success">
                            <h3>🎉 ¡Auditoría Completada Exitosamente!</h3>
                            <p><strong>Puntaje de Cumplimiento: ${score.toFixed(1)}%</strong></p>
                            <p>Preguntas respondidas: ${findings.length}</p>
                            <p>Respuestas conformes: ${compliantCount}</p>
                            <p>Respuestas no conformes: ${findings.length - compliantCount}</p>
                            <button onclick="location.reload()">Hacer Otra Auditoría</button>
                        </div>
                    `;
                    
                    showMessage('¡Auditoría completada y guardada!');
                } else {
                    const error = await response.json();
                    showMessage(`Error completando auditoría: ${error.detail}`, 'error');
                }
            } catch (error) {
                showMessage(`Error: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
